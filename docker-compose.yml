version: "3.8"

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app
    env_file:
      - path: backend/.env
        required: false
    environment:
      - TASK_QUEUE_BACKEND=arq
      - REDIS_DSN=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["uv", "run", "arq", "app.worker.WorkerSettings"]
    volumes:
      - db_data:/app
    env_file:
      - path: backend/.env
        required: false
    environment:
      - TASK_QUEUE_BACKEND=arq
      - REDIS_DSN=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: ../Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
